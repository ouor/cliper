[package]
name = "cliper-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
reqwest.workspace = true
url.workspace = true
regex.workspace = true
tracing.workspace = true
chrono.workspace = true
ort = { version = "=2.0.0-rc.13", features = ["cuda"] }
ndarray = "0.17"
realfft = "3"
rayon = "1"
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_Security_Cryptography", "Win32_Foundation"] }

[features]
# `cargo test -p cliper-core --features ts export_bindings` writes TypeScript types
ts = ["dep:ts-rs"]
