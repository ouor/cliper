[workspace]
resolver = "3"
members = ["crates/cliper-core", "crates/cliper"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form", "gzip", "http2"] }
url = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
