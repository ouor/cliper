[project]
name = "cliper-export-models"
version = "0.1.0"
description = "Dev-time only: export PANNs to ONNX and produce golden fixtures for the Rust core"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "panns-inference>=0.1.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "numpy>=2",
    "scipy>=1.14",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
